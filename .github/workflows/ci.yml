name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# The default token can write; a build and a test run only need to read.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q model_eol tests
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Scan this repository with itself
        # The table lists every retired id, so the tool matches its own table.
        # Excluding it proves the scan runs and stays quiet on real code.
        run: python -m model_eol.cli . --exclude 'model_eol/*' --exclude 'tests/*' --exclude 'README.md'
